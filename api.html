  <script>

    // FETCH API
  //  const url_1 = "https://apimocker.com/users";
  const url_1 =  "https://jsonplaceholder.typicode.com/users"
    
    async function getUsers() {
    const response = await fetch(url_1);
    // console.log(response)
     const data = await response.json();
    //  console.log(data)
     const resData = data.slice(0,6)
    
     resData.forEach((element, index) => {
        // console.log(element);

        const _name = `${element.name}`;
        const _email = `${element.email}`;
   
        const div = document.createElement("div");
 
        div.className = "card";

        const listItem1 = document.createElement("li");
        const listItem2 = document.createElement("li");

        const image = document.createElement("img");

        // use image from images.js by matching index
        if (images[index]) {
          image.src = images[index].img
        } else {
          image.src = "images/default.jpg"; // fallback if not enough images
        }

        image.style.width = "70px";
        image.style.height = "70px"
        image.style.marginBottom = "15px";

        const el_name = document.createTextNode(_name);
        const el_email = document.createTextNode(_email);

        listItem1.appendChild(el_name);
        listItem2.appendChild(el_email);

        div.appendChild(image);
        div.appendChild(listItem1);
        div.appendChild(listItem2);

        const app = document.getElementById("app");
        app.className = "user-grid";
        app.appendChild(div);
      });
    }
    getUsers();

  const url_2 = "https://jsonplaceholder.typicode.com/posts?_limit=6"

// AXIOS ( third party API)
    async function getPosts(){
      try {
        const res = await axios.get(url_2)
        showOutput(res)
      } catch (error) {
        console.error(err)
      }
    }

    function showOutput(res) {
      const data = res.data;
      // console.log(data);
      document.getElementById("res").innerHTML = `
      <div class="users">
        <h1>Posts</h1>
      </div>

      <div class="user-grid  posts">
        <div>
          <img  src="./images/fetch-lg.png" />
        </div>
      <div class="res">
        <ul class="title">
              ${res.data
          .map(
            (post) =>
              `<li class='card para'>${post.title}</li>`
          )
          .join("")}
        </ul>
      </div>
`;
    }

    getPosts();
