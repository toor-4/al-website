  <style>
    .container.media h1 {
      text-align: center;
      margin: 40px 0;
    }

    img {
      height: 80vh;
      width: auto;
      margin-bottom: 20px;
      /* object-fit: contain; */
    }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 20px; /* optional for spacing */
    }

    /* Desktop layout */
    .left {
      grid-column: 1 / 2;
      grid-row: 1 / 4;
    }
    .right {
      grid-column: 3 / 8;
      grid-row: 1 / 2;
      align-self: center;
      border-left: 1px solid rgba(0, 0, 0, 0.8);
      padding: 20px;
    }
    .lorem {
      grid-column: 3 / 8;
      grid-row: 2 / 3;
      padding: 0;
    }

    .lorem p {
      margin-top: 0;
    }

    /* ✅ Responsive layout for smaller screens */
    @media (max-width: 800px) {
      .user-grid {
        grid-template-columns: 1fr; /* single column */
        grid-template-rows: auto;
      }

      /* Reset grid placement */
      .left,
      .right,
      .lorem {
        grid-column: auto;
        grid-row: auto;
        justify-self: center; /* optional: center items horizontally */
      }

      img {
        width: 100%;
        height: auto; /* make image scale down properly */
      }

      iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9; /* keeps video proportions */
      }
      .right {
        border: none;
      }
    }
  </style>

          <img src="./images/me-h2O.png" />
          <!-- width="560"
          height="314" -->
        </div>

        <div class="right">
          <iframe
            src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Falfred.teogalbo%2Fvideos%2F2256096624422738%2F&show_text=false&width=560&t=0"
            width="360"

        </div>
        <div class="lorem">

      </div>
